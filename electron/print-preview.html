<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <title>Print</title>
    <style>
      :root {
        --navy-900: #0e2464;
        --navy-800: #16307f;
        --yellow: #ffde17;
        --muted: #5a6b85;
        --line: #e3e8f1;
        --wash: #f5f7fc;
        --canvas: #fbfcfe;
        --error: #9f1239;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        width: 320px;
        display: flex;
        flex-direction: column;
        background: var(--canvas);
        border-right: 1px solid var(--line);
        font: 13px/1.45 'Segoe UI', system-ui, sans-serif;
        color: var(--navy-900);
      }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 26px 24px 20px;
      }
      .bar {
        width: 36px;
        height: 4px;
        border-radius: 99px;
        background: var(--yellow);
      }
      h1 {
        margin: 14px 0 0;
        font-size: 19px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12.5px;
      }
      label {
        display: block;
        margin-top: 22px;
        margin-bottom: 6px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
      }
      select,
      input {
        width: 100%;
        height: 40px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
        font: inherit;
        color: var(--navy-900);
      }
      input {
        width: 96px;
      }
      select:focus,
      input:focus {
        outline: none;
        border-color: #2b52c4;
        box-shadow: 0 0 0 3px rgba(43, 82, 196, 0.14);
      }
      .note {
        margin-top: 18px;
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--wash);
        color: var(--muted);
        font-size: 12px;
      }
      .error {
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #fdf2f5;
        color: var(--error);
        font-size: 12px;
        font-weight: 600;
      }
      footer {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        padding: 16px 24px 20px;
        border-top: 1px solid var(--line);
      }
      button {
        height: 40px;
        padding: 0 18px;
        border: 0;
        border-radius: 10px;
        font: inherit;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost {
        background: transparent;
        color: var(--muted);
      }
      button.ghost:hover {
        background: var(--wash);
        color: var(--navy-900);
      }
      button.primary {
        background: var(--navy-900);
        color: #fff;
        min-width: 96px;
      }
      button.primary:hover {
        background: var(--navy-800);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="bar"></div>
      <h1 id="title">Print</h1>
      <p class="sub" id="pages"></p>

      <label for="printer">Printer</label>
      <select id="printer"></select>

      <label for="copies">Copies</label>
      <input id="copies" type="number" min="1" max="99" value="1" />

      <p class="note" id="none" hidden>No printer is installed on this computer. Add one in Windows Settings.</p>
      <p class="error" id="error" role="alert" hidden></p>
    </main>
    <footer>
      <button type="button" class="ghost" id="cancel">Cancel</button>
      <button type="button" class="primary" id="print" disabled>Print</button>
    </footer>
    <script src="print-preview.js"></script>
  </body>
</html>
